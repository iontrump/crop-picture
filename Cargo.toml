[package]
name = "crop-picture"
version = "1.0.0"
edition = "2021"
authors = ["iontrump"]
description = "GNOME Desktop native custom-size image cropping tool"
repository = "https://github.com/iontrump/crop-picture"
homepage = "https://github.com/iontrump/crop-picture"
license = "MIT OR Apache-2.0"

[lib]
name = "crop_picture"
path = "src/lib.rs"

[[bin]]
name = "crop-picture"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:gtk4", "dep:libadwaita", "dep:gio", "dep:glib", "dep:gdk4", "dep:graphene-rs"]

[dependencies]
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_14"], optional = true }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_5"], optional = true }
gio = { version = "0.20", features = ["v2_76"], optional = true }
glib = { version = "0.20", optional = true }
gdk4 = { version = "0.9", optional = true }
graphene-rs = { version = "0.20", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.10"

[package.metadata.deb]
name = "crop-picture"
maintainer = "iontrump"
copyright = "2026 iontrump"
license-file = ["LICENSE", "4"]
extended-description = "GNOME Desktop native custom-size image cropping tool."
section = "graphics"
priority = "optional"
depends = "libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), libc6 (>= 2.34)"
assets = [
    ["target/release/crop-picture", "usr/bin/", "755"],
    ["data/org.example.CropPicture.desktop", "usr/share/applications/", "644"],
    ["data/org.example.CropPicture.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.example.CropPicture.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
    ["data/icons/hicolor/scalable/apps/org.example.CropPicture.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/org.example.CropPicture-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]
maintainer-scripts = "debian/scripts"
