<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Plate -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Image Frame -->
  <rect x="26" y="26" width="76" height="76" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <!-- Landscape Silhouette -->
  <polygon points="26,82 52,54 74,76 86,64 102,82 102,102 26,102" fill="#ffffff" fill-opacity="0.3"/>
  <!-- Sun -->
  <circle cx="44" cy="46" r="8" fill="#f6d32d"/>
  <!-- Crop Box (1000x1000 square indicator) -->
  <rect x="36" y="36" width="56" height="56" rx="4" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="10,4"/>
  <!-- Crop Corner Handles -->
  <path d="M 32 46 L 32 32 L 46 32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 96 46 L 96 32 L 82 32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 32 82 L 32 96 L 46 96" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 96 82 L 96 96 L 82 96" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>

